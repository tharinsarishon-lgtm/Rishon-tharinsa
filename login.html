<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in — Nexora</title>
  <meta name="theme-color" content="#07060f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%238b5cf6'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M10 22V10l12 12V10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body class="auth-body">
  <div class="auth">
    <!-- 3D visual: side panel on laptop, full background on phone/tablet -->
    <aside class="auth-visual" aria-hidden="true">
      <canvas class="bg-canvas" id="authCanvas"></canvas>
      <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V6l12 12V6"/></svg></span>Nexora</a>
      <div class="auth-visual-copy">
        <h2>Welcome back to the <span class="gradient-text">next dimension</span></h2>
        <p>Your dashboard, orders and team are waiting. Log in to pick up right where you left off.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-top">
        <a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18V6l12 12V6"/></svg></span>Nexora</a>
        <a href="index.html" class="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Back to home</a>
      </div>

      <div class="auth-card">
        <h1>Log in</h1>
        <p class="sub">Welcome back! Please enter your details.</p>

        <div class="social">
          <button type="button" class="btn btn-ghost" data-social="Google">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.3 6.6 2.3 12s4.3 9.8 9.7 9.8c5.6 0 9.3-3.9 9.3-9.5 0-.6-.1-1.1-.2-1.6H12z"/></svg>
            Google
          </button>
          <button type="button" class="btn btn-ghost" data-social="Apple">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3-1.5z"/></svg>
            Apple
          </button>
        </div>

        <div class="divider">or continue with email</div>

        <form class="form" id="loginForm" novalidate>
          <div class="field" data-field="email">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
              <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <span class="error-msg" role="alert"></span>
          </div>

          <div class="field" data-field="password">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input has-toggle" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="8">
              <button type="button" class="toggle-pass" aria-label="Show password" data-toggle-pass="password"></button>
            </div>
            <span class="error-msg" role="alert"></span>
          </div>

          <div class="form-meta">
            <label class="check">
              <input type="checkbox" name="remember">
              <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              Remember me
            </label>
            <a href="#" class="link" id="forgotLink">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="signup.html" class="link">Sign up</a></p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { createScene } from './js/scene.js';
    createScene(document.getElementById('authCanvas'), { variant: 'auth' });
  </script>
  <script src="js/auth.js" defer></script>
</body>
</html>
